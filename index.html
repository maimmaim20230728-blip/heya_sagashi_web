<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e6b">
<title>わたしに合う部屋さがし・そよぎ</title>
<meta name="description" content="賃貸の部屋さがしで、探す前から住んだあとまでにすることを、やさしい言葉のカードと内見のチェックシートで。頼んでよいことと使える仕組みも。端末内のみ・オフライン・登録なし。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="heya.css">
</head>
<body class="fs0">
<header id="hd">
  <div id="hd-title">わたしに合う部屋さがし・そよぎ</div>
  <div id="hd-right">
    <div id="lang-wrap">
      <span class="lang-label">Language</span>
      <select id="set-lang" aria-label="Language 言語">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>
    <!-- すぐ閉じる(app.js quickExit)。重ねた画面はヘッダーの下に出すので、いつも見えている -->
    <button id="btn-qx" class="qx-btn" type="button"></button>
  </div>
</header>

<main id="main">

  <!-- 画面は screens/<id>.js が描く。ナビは6個まで -->
  <section id="scr-home" class="screen" data-scr="home"></section>
  <section id="scr-cards" class="screen hidden" data-scr="cards"></section>
  <section id="scr-naiken" class="screen hidden" data-scr="naiken"></section>
  <section id="scr-joken" class="screen hidden" data-scr="joken"></section>
  <section id="scr-soudan" class="screen hidden" data-scr="soudan"></section>

  <!-- せってい(共通シェル。文言は app.js の I18N_MAP が入れる) -->
  <section id="scr-set" class="screen hidden" data-scr="set">
    <h2 id="set-h-normal" class="sec-h"></h2>
    <div class="set-row"><span id="lbl-fs"></span><button id="btn-fs" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-theme"></span><button id="btn-theme" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-bgm"></span><button id="btn-bgm" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-sound"></span><button id="btn-sound" class="set-btn"></button></div>

    <!-- アプリ固有の設定行(heya_ui.js がつなぐ。文言は app.js の I18N_MAP) -->
    <div id="set-app-rows">
      <div class="set-row"><span id="lbl-sources"></span><button id="btn-sources" class="set-btn"></button></div>
      <div class="set-row"><span id="lbl-wipe"></span><button id="btn-wipe" class="set-btn"></button></div>
      <p id="set-notapp" class="hint"></p>
    </div>
    <!-- はじめての つかいかた を もう一度(app.js openGuide・GUIDE_AGAIN=false なら隠す) -->
    <div id="set-guide-row" class="set-row"><span id="lbl-guide"></span><button id="btn-guide" class="set-btn"></button></div>

    <h2 id="set-h-backup" class="sec-h"></h2>
    <p id="bk-hint" class="hint"></p>
    <div class="bk-row">
      <button id="bk-export" class="set-btn"></button>
      <button id="bk-import" class="set-btn"></button>
    </div>
    <input id="bk-file" type="file" accept="application/json,.json" class="hidden">

    <p id="set-note" class="hint"></p>
    <p class="credit"><a id="link-privacy" href="privacy.html"></a></p>
    <p class="credit"><a id="about-credit" href="https://soudansoyogi.com/" target="_blank" rel="noopener"></a></p>
    <p id="about-ver" class="credit"></p>
  </section>

</main>

<nav id="navbar">
  <button id="nav-home" class="nav-btn active" data-scr="home"></button>
  <button id="nav-cards" class="nav-btn" data-scr="cards"></button>
  <button id="nav-naiken" class="nav-btn" data-scr="naiken"></button>
  <button id="nav-joken" class="nav-btn" data-scr="joken"></button>
  <button id="nav-soudan" class="nav-btn" data-scr="soudan"></button>
  <button id="nav-set" class="nav-btn" data-scr="set"></button>
</nav>

<div id="toast" class="toast"></div>

<script src="audio.js"></script>
<script src="tap.js"></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="heya_ui.js"></script>
<script src="screens/router.js"></script>
<script src="screens/home.js"></script>
<script src="screens/cards.js"></script>
<script src="screens/naiken.js"></script>
<script src="screens/joken.js"></script>
<script src="screens/soudan.js"></script>
<script src="app.js"></script>
</body>
</html>
